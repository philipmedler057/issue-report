<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Issue Report</title>
<style>
:root{--bg:#07111f;--panel:#101c2d;--panel2:#16243a;--text:#f6f8fb;--muted:#9aacc3;--accent:#3385f5;--danger:#ffb5bd;--border:#23344e}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
.app{max-width:840px;margin:0 auto;min-height:100vh;padding:18px 16px 110px} .hidden{display:none!important}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.title{font-size:27px;font-weight:800;line-height:1.05} .muted{color:var(--muted);font-size:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:16px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center} .grow{flex:1} .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
button{border:0;border-radius:15px;padding:12px 15px;font-weight:750;font-size:15px} .primary{background:var(--accent);color:white}
.secondary{background:var(--panel2);color:white;border:1px solid var(--border)} .danger{background:#401b24;color:var(--danger);border:1px solid #74303c}
input,textarea,select{width:100%;background:#0a1626;color:white;border:1px solid var(--border);border-radius:14px;padding:13px 14px;font-size:16px}
textarea{min-height:105px;resize:vertical} label{display:block;margin:13px 0 7px;color:var(--muted);font-size:14px}
.empty{text-align:center;padding:38px;color:var(--muted)}
.issue-card{display:grid;grid-template-columns:82px 1fr auto;gap:13px;align-items:center;cursor:pointer;transition:transform .08s ease}
.issue-card:active{transform:scale(.99)} .thumb{width:82px;height:68px;border-radius:13px;object-fit:cover;background:#0b1727}
.issue-title{font-size:17px;font-weight:760;line-height:1.25} .delete-small{padding:9px 12px;font-size:13px}
.photo-row{display:grid;grid-template-columns:102px 1fr;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--border)}
.photo-row:last-child{border-bottom:0} .photo-preview,.photo-placeholder{width:102px;height:80px;border-radius:13px;background:#0a1626}
.photo-preview{object-fit:cover} .photo-placeholder{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
.detail-photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px} .detail-photo-grid img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;background:#0a1626}
.detail-kv{padding:10px 0;border-bottom:1px solid var(--border)} .detail-kv:last-child{border-bottom:0}
.detail-label{font-size:12px;color:var(--muted);margin-bottom:3px} .detail-value{font-size:16px}
@media(max-width:560px){.top{align-items:flex-start}.issue-card{grid-template-columns:72px 1fr}.thumb{width:72px;height:62px}.issue-actions{grid-column:1/-1;justify-self:end}}
</style>
</head>
<body>
<div class="app">
<section id="auth">
  <div class="card" style="max-width:460px;margin:60px auto">
    <div class="muted">Issue Report</div><div class="title">Sign in</div>
    <label>Email</label><input id="email" type="email">
    <label>Password</label><input id="password" type="password">
    <div class="toolbar"><button class="primary grow" onclick="signIn()">Sign in</button><button class="secondary grow" onclick="signUp()">Create account</button></div>
    <div id="authmsg" class="muted"></div>
  </div>
</section>

<section id="projects" class="hidden">
  <div class="top"><div><div class="muted">Issue Report</div><div class="title">Projects</div></div><button class="secondary" onclick="signOut()">Sign out</button></div>
  <div class="toolbar"><button class="primary" onclick="showNewProject()">+ New Project</button></div>
  <div id="projectList"></div>
</section>

<section id="newProject" class="hidden">
  <div class="top"><button class="secondary" onclick="loadProjects()">← Back</button><div class="title">New Project</div></div>
  <div class="card"><label>Name</label><input id="pname"><label>Venue</label><input id="pvenue"><button class="primary" style="margin-top:14px;width:100%" onclick="createProject()">Create</button></div>
</section>

<section id="project" class="hidden">
  <div class="top"><button class="secondary" onclick="loadProjects()">← Projects</button><div><div id="pmeta" class="muted"></div><div id="ptitle" class="title"></div></div></div>
  <div class="toolbar"><button class="primary" onclick="newIssue()">+ New Issue</button><button class="secondary" onclick="locations()">Locations</button><button class="secondary" onclick="exportPDF()">Export PDF</button></div>
  <div id="issueList"></div>
</section>

<section id="issueDetail" class="hidden">
  <div class="top"><button class="secondary" onclick="openProject(currentProject)">← Back</button><div id="detailTitle" class="title"></div></div>
  <div class="card">
    <div class="detail-kv"><div class="detail-label">Description</div><div id="detailDescription" class="detail-value"></div></div>
    <div class="detail-kv"><div class="detail-label">Location</div><div id="detailLocation" class="detail-value"></div></div>
    <div class="detail-kv"><div class="detail-label">Category</div><div id="detailCategory" class="detail-value"></div></div>
    <div class="detail-kv"><div class="detail-label">Status</div><div id="detailStatus" class="detail-value"></div></div>
    <div id="detailPhotos" class="detail-photo-grid"></div>
  </div>
  <button id="detailDelete" class="danger">Delete Issue</button>
</section>

<section id="locations" class="hidden">
  <div class="top"><button class="secondary" onclick="openProject(currentProject)">← Back</button><div class="title">Locations</div></div>
  <div class="card"><div class="muted">Add as many locations as needed.</div><label>Add location</label><div class="row"><input id="locname"><button class="primary" onclick="addLocation()">Add</button></div></div>
  <div id="locCount" class="muted" style="margin-bottom:10px"></div><div id="locList"></div>
</section>

<section id="newIssue" class="hidden">
  <div class="top"><button class="secondary" onclick="openProject(currentProject)">← Back</button><div class="title">New Issue</div></div>
  <div class="card">
    <label>Photos — up to 4</label>
    <div class="photo-row"><div id="ph1" class="photo-placeholder">Photo 1</div><div><div class="muted" style="margin-bottom:6px">Photo 1</div><input id="photo1" type="file" accept="image/*" capture="environment"></div></div>
    <div class="photo-row"><div id="ph2" class="photo-placeholder">Photo 2</div><div><div class="muted" style="margin-bottom:6px">Photo 2</div><input id="photo2" type="file" accept="image/*" capture="environment"></div></div>
    <div class="photo-row"><div id="ph3" class="photo-placeholder">Photo 3</div><div><div class="muted" style="margin-bottom:6px">Photo 3</div><input id="photo3" type="file" accept="image/*" capture="environment"></div></div>
    <div class="photo-row"><div id="ph4" class="photo-placeholder">Photo 4</div><div><div class="muted" style="margin-bottom:6px">Photo 4</div><input id="photo4" type="file" accept="image/*" capture="environment"></div></div>

    <label>Description</label><textarea id="desc"></textarea>
    <label>Location</label><select id="location"></select>
    <label>Category</label><input id="category">
    <label>Status</label><select id="status"><option value="open">Open</option><option value="resolved">Resolved</option></select>
    <button class="primary" style="margin-top:14px;width:100%" onclick="saveIssue()">Save Issue</button>
    <div id="issuemsg" class="muted" style="margin-top:8px"></div>
  </div>
</section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script>
const sb=window.supabase.createClient("https://bewfwmbzajtzcokatpge.supabase.co","sb_publishable_bHfwvhnZVE4glAAf2FPBHw_QQQspCyK");
let currentProject=null,currentIssues=[],currentLocations=[],currentIssue=null;
const el=id=>document.getElementById(id);
function show(id){['auth','projects','newProject','project','issueDetail','locations','newIssue'].forEach(x=>el(x).classList.toggle('hidden',x!==id));}
function safe(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}

async function boot(){const {data}=await sb.auth.getSession();if(data.session)loadProjects();else show('auth');}
async function signUp(){const {error}=await sb.auth.signUp({email:el('email').value.trim(),password:el('password').value});el('authmsg').textContent=error?error.message:'Account created. Check email if confirmation is enabled.';}
async function signIn(){const {error}=await sb.auth.signInWithPassword({email:el('email').value.trim(),password:el('password').value});if(error)el('authmsg').textContent=error.message;else loadProjects();}
async function signOut(){await sb.auth.signOut();show('auth');}

function showNewProject(){show('newProject')}
async function createProject(){
 const name=el('pname').value.trim();if(!name)return alert('Project name required.');
 const {data:u}=await sb.auth.getUser();
 const {error}=await sb.from('projects').insert({name,venue:el('pvenue').value.trim(),owner_id:u.user.id});
 if(error)return alert(error.message); el('pname').value='';el('pvenue').value='';loadProjects();
}
async function loadProjects(){
 const {data,error}=await sb.from('projects').select('*').order('created_at',{ascending:false});
 if(error)return alert(error.message);
 el('projectList').innerHTML=(data||[]).map(p=>`<div class="card" data-id="${p.id}"><b>${safe(p.name)}</b><div class="muted">${safe(p.venue||'')}</div></div>`).join('')||'<div class="empty">No projects yet.</div>';
 el('projectList').querySelectorAll('[data-id]').forEach(c=>c.onclick=()=>openProject(data.find(p=>p.id===c.dataset.id)));show('projects');
}

async function openProject(p){
 currentProject=p;el('ptitle').textContent=p.name;el('pmeta').textContent=p.venue||'';
 const {data,error}=await sb.from('issues').select('*,locations(name),issue_photos(*)').eq('project_id',p.id).order('issue_number');
 if(error)return alert(error.message); currentIssues=data||[];
 el('issueList').innerHTML=currentIssues.map(i=>{
   const first=(i.issue_photos||[]).sort((a,b)=>a.position-b.position)[0];
   return `<div class="card issue-card" data-open="${i.id}">
     ${first?`<img class="thumb" data-photo-path="${safe(first.storage_path)}">`:'<div class="thumb"></div>'}
     <div><div class="issue-title">#${String(i.issue_number).padStart(3,'0')} ${safe(i.description)}</div><div class="muted">${safe(i.locations?.name||'No location')}</div></div>
     <div class="issue-actions"><button class="danger delete-small" data-delete="${i.id}">Delete</button></div>
   </div>`;
 }).join('')||'<div class="empty">No issues yet.</div>';

 for(const img of el('issueList').querySelectorAll('[data-photo-path]')){
   const {data:signed}=await sb.storage.from('issue-photos').createSignedUrl(img.dataset.photoPath,3600);
   if(signed?.signedUrl)img.src=signed.signedUrl;
 }
 el('issueList').querySelectorAll('[data-open]').forEach(card=>card.onclick=e=>{
   if(e.target.closest('[data-delete]'))return;
   openIssue(card.dataset.open);
 });
 el('issueList').querySelectorAll('[data-delete]').forEach(btn=>btn.onclick=e=>{e.stopPropagation();deleteIssue(btn.dataset.delete);});
 show('project');
}

async function openIssue(issueId){
 currentIssue=currentIssues.find(i=>i.id===issueId);if(!currentIssue)return;
 el('detailTitle').textContent='#'+String(currentIssue.issue_number).padStart(3,'0');
 el('detailDescription').textContent=currentIssue.description||'-';
 el('detailLocation').textContent=currentIssue.locations?.name||'-';
 el('detailCategory').textContent=currentIssue.category||'-';
 el('detailStatus').textContent=currentIssue.status||'-';
 el('detailPhotos').innerHTML='';
 const photos=(currentIssue.issue_photos||[]).sort((a,b)=>a.position-b.position);
 for(const p of photos){
   const {data:signed}=await sb.storage.from('issue-photos').createSignedUrl(p.storage_path,3600);
   if(signed?.signedUrl){const img=document.createElement('img');img.src=signed.signedUrl;el('detailPhotos').appendChild(img);}
 }
 el('detailDelete').onclick=()=>deleteIssue(currentIssue.id);
 show('issueDetail');
}

async function deleteIssue(issueId){
 const issue=currentIssues.find(i=>i.id===issueId);if(!issue)return;
 if(!confirm(`Delete Issue #${String(issue.issue_number).padStart(3,'0')}? This cannot be undone.`))return;
 const paths=(issue.issue_photos||[]).map(p=>p.storage_path).filter(Boolean);
 if(paths.length){const {error:se}=await sb.storage.from('issue-photos').remove(paths);if(se)return alert('Could not delete photos: '+se.message);}
 const {error}=await sb.from('issues').delete().eq('id',issueId);if(error)return alert(error.message);
 await openProject(currentProject);
}

async function loadLocations(){
 const {data,error}=await sb.from('locations').select('*').eq('project_id',currentProject.id).eq('active',true).order('sort_order').order('name');
 if(error)return alert(error.message);currentLocations=data||[];
}
async function locations(){await loadLocations();el('locCount').textContent=`${currentLocations.length} location${currentLocations.length===1?'':'s'}`;el('locList').innerHTML=currentLocations.map(l=>`<div class="card">${safe(l.name)}</div>`).join('')||'<div class="empty">No locations yet.</div>';show('locations');}
async function addLocation(){const name=el('locname').value.trim();if(!name)return;const {error}=await sb.from('locations').insert({project_id:currentProject.id,name});if(error)return alert(error.message);el('locname').value='';locations();}

function previewInput(inputId,previewId){
 el(inputId).addEventListener('change',()=>{
   const file=el(inputId).files[0];const old=el(previewId);
   if(!file)return;
   const img=document.createElement('img');img.id=previewId;img.className='photo-preview';img.src=URL.createObjectURL(file);old.replaceWith(img);
 });
}
previewInput('photo1','ph1');previewInput('photo2','ph2');previewInput('photo3','ph3');previewInput('photo4','ph4');

function resetPhotoSlot(n){
 const input=el('photo'+n);input.value='';
 const old=el('ph'+n);
 if(old && old.tagName==='IMG'){const d=document.createElement('div');d.id='ph'+n;d.className='photo-placeholder';d.textContent='Photo '+n;old.replaceWith(d);previewInput('photo'+n,'ph'+n);}
}
async function newIssue(){
 await loadLocations();el('location').innerHTML='<option value="">Select location</option>'+currentLocations.map(l=>`<option value="${l.id}">${safe(l.name)}</option>`).join('');
 el('desc').value='';el('category').value='';el('status').value='open';el('issuemsg').textContent='';
 for(let n=1;n<=4;n++)resetPhotoSlot(n);show('newIssue');
}

async function fileToJpegBlob(file,maxSide=1800,quality=.86){
 return new Promise((resolve,reject)=>{
   const objectUrl=URL.createObjectURL(file);
   const img=new Image();
   img.onload=()=>{
     try{
       const scale=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight));
       const canvas=document.createElement('canvas');
       canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
       const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);
       canvas.toBlob(blob=>{URL.revokeObjectURL(objectUrl);blob?resolve(blob):reject(new Error('Photo conversion failed'));},'image/jpeg',quality);
     }catch(err){URL.revokeObjectURL(objectUrl);reject(err);}
   };
   img.onerror=()=>{URL.revokeObjectURL(objectUrl);reject(new Error('This photo format could not be read.'));};
   img.src=objectUrl;
 });
}

async function saveIssue(){
 const d=el('desc').value.trim();if(!d)return alert('Description required.');
 const chosen=[el('photo1').files[0],el('photo2').files[0],el('photo3').files[0],el('photo4').files[0]].filter(Boolean);
 el('issuemsg').textContent='Saving issue...';
 const {data:issue,error}=await sb.from('issues').insert({project_id:currentProject.id,issue_number:0,description:d,location_id:el('location').value||null,category:el('category').value||null,status:el('status').value}).select().single();
 if(error){el('issuemsg').textContent=error.message;return;}
 const {data:u}=await sb.auth.getUser();
 for(let n=0;n<chosen.length;n++){
   try{
     el('issuemsg').textContent=`Preparing photo ${n+1}/${chosen.length}...`;
     const jpeg=await fileToJpegBlob(chosen[n]);
     const path=`${currentProject.id}/${issue.id}/${crypto.randomUUID()}.jpg`;
     el('issuemsg').textContent=`Uploading photo ${n+1}/${chosen.length}...`;
     const {error:ue}=await sb.storage.from('issue-photos').upload(path,jpeg,{contentType:'image/jpeg',cacheControl:'3600'});
     if(ue)throw ue;
     const {error:re}=await sb.from('issue_photos').insert({issue_id:issue.id,storage_path:path,position:n+1,created_by:u.user.id});
     if(re)throw re;
   }catch(err){el('issuemsg').textContent='Photo error: '+(err.message||err);return;}
 }
 await openProject(currentProject);
}

async function urlToJpegDataUrl(url){
 return new Promise((resolve,reject)=>{
   const img=new Image();img.crossOrigin='anonymous';
   img.onload=()=>{
     const canvas=document.createElement('canvas');canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;
     canvas.getContext('2d').drawImage(img,0,0);
     resolve(canvas.toDataURL('image/jpeg',0.88));
   };
   img.onerror=()=>reject(new Error('Could not load photo for PDF'));img.src=url;
 });
}

async function exportPDF(){
 if(!currentIssues.length)return alert('No issues to export.');
 const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});
 for(let x=0;x<currentIssues.length;x++){
   if(x)doc.addPage();const i=currentIssues[x];
   doc.setFont('helvetica','bold');doc.setFontSize(10);doc.text('PROJECT ISSUE REPORT',15,15);
   doc.setFontSize(19);doc.text(currentProject.name,15,27);
   doc.setFont('helvetica','normal');doc.setFontSize(9);doc.text(currentProject.venue||'',15,34);doc.line(15,39,195,39);
   doc.setFont('helvetica','bold');doc.setFontSize(17);doc.text('ISSUE #'+String(i.issue_number).padStart(3,'0'),15,51);
   doc.setFontSize(9);doc.text('Location:',15,61);doc.setFont('helvetica','normal');doc.text(i.locations?.name||'-',34,61);
   doc.setFont('helvetica','bold');doc.text('Category:',15,68);doc.setFont('helvetica','normal');doc.text(i.category||'-',34,68);
   doc.setFont('helvetica','bold');doc.text('Description',15,79);doc.setFont('helvetica','normal');doc.setFontSize(10);
   const lines=doc.splitTextToSize(i.description,180);doc.text(lines,15,87);
   const y=Math.min(112,87+lines.length*5+7);
   const photos=(i.issue_photos||[]).sort((a,b)=>a.position-b.position).slice(0,4);
   const cells=[{x:15,y:y,w:87,h:63},{x:108,y:y,w:87,h:63},{x:15,y:y+68,w:87,h:63},{x:108,y:y+68,w:87,h:63}];
   for(let n=0;n<photos.length;n++){
     try{
       const {data:signed}=await sb.storage.from('issue-photos').createSignedUrl(photos[n].storage_path,300);
       if(!signed?.signedUrl)continue;
       const dataUrl=await urlToJpegDataUrl(signed.signedUrl);const props=doc.getImageProperties(dataUrl);const c=cells[n];
       const ratio=Math.min(c.w/props.width,c.h/props.height);const w=props.width*ratio,h=props.height*ratio;
       doc.addImage(dataUrl,'JPEG',c.x+(c.w-w)/2,c.y+(c.h-h)/2,w,h);
     }catch(err){console.warn('PDF photo skipped',err);}
   }
   doc.setFontSize(8);doc.setTextColor(120);doc.text('Created: '+new Date(i.created_at).toLocaleString(),15,288);doc.setTextColor(0);
 }
 doc.save((currentProject.name||'project').replace(/[^a-z0-9]+/gi,'_')+'_issues.pdf');
}
boot();
</script>
</body>
</html>

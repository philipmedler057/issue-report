<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Issue Report</title>
<style>
:root{--bg:#08111f;--panel:#101b2d;--panel2:#152238;--text:#f4f7fb;--muted:#9fb0c8;--accent:#2f80ed;--border:#22314a}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
.app{max-width:820px;margin:0 auto;padding:18px 16px 100px;min-height:100vh}
.card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:16px}
.title{font-size:26px;font-weight:800} .muted{color:var(--muted);font-size:14px}
input,textarea,select{width:100%;background:#0b1627;color:white;border:1px solid var(--border);border-radius:14px;padding:13px;font-size:16px}
textarea{min-height:100px} label{display:block;margin:12px 0 6px;color:var(--muted);font-size:14px}
button{border:0;border-radius:14px;padding:12px 15px;font-weight:700;font-size:15px}
.primary{background:var(--accent);color:#fff} .secondary{background:var(--panel2);color:#fff;border:1px solid var(--border)} .hidden{display:none}
.row{display:flex;gap:10px;align-items:center} .grow{flex:1} .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.issue{display:grid;grid-template-columns:78px 1fr;gap:12px;align-items:center} .thumb{width:78px;height:64px;object-fit:cover;border-radius:12px;background:#0b1627}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px} .grid img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#20304b;font-size:12px} .empty{text-align:center;padding:35px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
<section id="auth">
  <div class="card" style="max-width:460px;margin:60px auto">
    <div class="muted">Issue Report</div><div class="title">Sign in</div>
    <label>Email</label><input id="email" type="email">
    <label>Password</label><input id="password" type="password">
    <div class="toolbar"><button class="primary grow" onclick="signIn()">Sign in</button><button class="secondary grow" onclick="signUp()">Create account</button></div>
    <div id="authmsg" class="muted"></div>
  </div>
</section>

<section id="projects" class="hidden">
  <div class="top"><div><div class="muted">Issue Report</div><div class="title">Projects</div></div><button class="secondary" onclick="signOut()">Sign out</button></div>
  <div class="toolbar"><button class="primary" onclick="showNewProject()">+ New Project</button></div>
  <div id="projectList"></div>
</section>

<section id="newProject" class="hidden">
  <div class="top"><button class="secondary" onclick="loadProjects()">← Back</button><div class="title">New Project</div></div>
  <div class="card"><label>Name</label><input id="pname"><label>Venue</label><input id="pvenue"><button class="primary" style="margin-top:14px;width:100%" onclick="createProject()">Create</button></div>
</section>

<section id="project" class="hidden">
  <div class="top"><button class="secondary" onclick="loadProjects()">← Projects</button><div><div id="pmeta" class="muted"></div><div id="ptitle" class="title"></div></div></div>
  <div class="toolbar">
    <button class="primary" onclick="newIssue()">+ New Issue</button>
    <button class="secondary" onclick="locations()">Locations</button>
    <button class="secondary" onclick="exportPDF()">Export PDF</button>
  </div>
  <div id="issueList"></div>
</section>

<section id="locations" class="hidden">
  <div class="top"><button class="secondary" onclick="openProject(currentProject)">← Back</button><div class="title">Locations</div></div>
  <div class="card"><label>Add location</label><div class="row"><input id="locname"><button class="primary" onclick="addLocation()">Add</button></div></div>
  <div id="locList"></div>
</section>

<section id="newIssue" class="hidden">
  <div class="top"><button class="secondary" onclick="openProject(currentProject)">← Back</button><div class="title">New Issue</div></div>
  <div class="card">
    <label>Photos (max 4)</label><input id="photos" type="file" accept="image/*" capture="environment" multiple><div id="preview" class="grid" style="margin-top:10px"></div>
    <label>Description</label><textarea id="desc"></textarea>
    <label>Location</label><select id="location"></select>
    <label>Category</label><input id="category">
    <label>Status</label><select id="status"><option value="open">Open</option><option value="resolved">Resolved</option></select>
    <button class="primary" style="margin-top:14px;width:100%" onclick="saveIssue()">Save Issue</button>
    <div id="issuemsg" class="muted" style="margin-top:8px"></div>
  </div>
</section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script>
const sb=window.supabase.createClient("https://bewfwmbzajtzcokatpge.supabase.co","sb_publishable_bHfwvhnZVE4glAAf2FPBHw_QQQspCyK");
let currentProject=null,currentIssues=[],currentLocations=[];

function show(id){['auth','projects','newProject','project','locations','newIssue'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));}
const el=id=>document.getElementById(id);

async function boot(){const {data}=await sb.auth.getSession(); if(data.session) loadProjects(); else show('auth');}
async function signUp(){const {error}=await sb.auth.signUp({email:el('email').value.trim(),password:el('password').value});el('authmsg').textContent=error?error.message:'Account created. Check email if confirmation is enabled.';}
async function signIn(){const {error}=await sb.auth.signInWithPassword({email:el('email').value.trim(),password:el('password').value});if(error)el('authmsg').textContent=error.message;else loadProjects();}
async function signOut(){await sb.auth.signOut();show('auth');}

function showNewProject(){show('newProject');}
async function createProject(){const {data:u}=await sb.auth.getUser();const {error}=await sb.from('projects').insert({name:el('pname').value.trim(),venue:el('pvenue').value.trim(),owner_id:u.user.id});if(error)return alert(error.message);loadProjects();}
async function loadProjects(){const {data,error}=await sb.from('projects').select('*').order('created_at',{ascending:false});if(error)return alert(error.message);el('projectList').innerHTML=(data||[]).map(p=>`<div class="card" data-id="${p.id}"><b>${p.name}</b><div class="muted">${p.venue||''}</div></div>`).join('')||'<div class="empty">No projects yet.</div>';el('projectList').querySelectorAll('[data-id]').forEach(c=>c.onclick=()=>openProject(data.find(p=>p.id===c.dataset.id)));show('projects');}
async function openProject(p){currentProject=p;el('ptitle').textContent=p.name;el('pmeta').textContent=p.venue||'';const {data,error}=await sb.from('issues').select('*,locations(name),issue_photos(*)').eq('project_id',p.id).order('issue_number');if(error)return alert(error.message);currentIssues=data||[];el('issueList').innerHTML=currentIssues.map(i=>`<div class="card issue"><div class="thumb"></div><div><b>#${String(i.issue_number).padStart(3,'0')} ${i.description}</b><div class="muted">${i.locations?.name||'No location'}</div><span class="badge">${i.status}</span></div></div>`).join('')||'<div class="empty">No issues yet.</div>';show('project');}

async function locations(){await loadLocations();el('locList').innerHTML=currentLocations.map(l=>`<div class="card">${l.name}</div>`).join('')||'<div class="empty">No locations yet.</div>';show('locations');}
async function loadLocations(){const {data,error}=await sb.from('locations').select('*').eq('project_id',currentProject.id).eq('active',true).order('sort_order').order('name');if(error)return alert(error.message);currentLocations=data||[];}
async function addLocation(){const name=el('locname').value.trim();if(!name)return;const {error}=await sb.from('locations').insert({project_id:currentProject.id,name});if(error)return alert(error.message);el('locname').value='';locations();}

async function newIssue(){await loadLocations();el('location').innerHTML='<option value="">Select location</option>'+currentLocations.map(l=>`<option value="${l.id}">${l.name}</option>`).join('');el('desc').value='';el('category').value='';el('photos').value='';el('preview').innerHTML='';show('newIssue');}
el('photos').addEventListener('change',e=>{let files=[...e.target.files];if(files.length>4){alert('Maximum 4 photos');files=files.slice(0,4)}el('preview').innerHTML='';files.forEach(f=>{let i=document.createElement('img');i.src=URL.createObjectURL(f);el('preview').appendChild(i)});});
async function saveIssue(){const d=el('desc').value.trim();if(!d)return alert('Description required');const files=[...el('photos').files].slice(0,4);el('issuemsg').textContent='Saving...';const {data:issue,error}=await sb.from('issues').insert({project_id:currentProject.id,issue_number:0,description:d,location_id:el('location').value||null,category:el('category').value||null,status:el('status').value}).select().single();if(error){el('issuemsg').textContent=error.message;return}const {data:u}=await sb.auth.getUser();for(let n=0;n<files.length;n++){const path=`${currentProject.id}/${issue.id}/${crypto.randomUUID()}.jpg`;const {error:ue}=await sb.storage.from('issue-photos').upload(path,files[n],{contentType:files[n].type||'image/jpeg'});if(ue){el('issuemsg').textContent=ue.message;return}await sb.from('issue_photos').insert({issue_id:issue.id,storage_path:path,position:n+1,created_by:u.user.id});}openProject(currentProject);}

async function exportPDF(){if(!currentIssues.length)return alert('No issues to export');const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});for(let x=0;x<currentIssues.length;x++){if(x)doc.addPage();const i=currentIssues[x];doc.setFontSize(18);doc.text(currentProject.name,15,20);doc.setFontSize(14);doc.text('ISSUE #'+String(i.issue_number).padStart(3,'0'),15,34);doc.setFontSize(10);doc.text('Location: '+(i.locations?.name||'-'),15,45);doc.text('Status: '+i.status,15,52);doc.text('Category: '+(i.category||'-'),15,59);doc.text(doc.splitTextToSize(i.description,180),15,72);}doc.save((currentProject.name||'project').replace(/[^a-z0-9]+/gi,'_')+'_issues.pdf');}
boot();
</script>
</body>
</html>
